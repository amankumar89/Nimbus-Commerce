name: Feature request
description: Propose a frontend or backend capability
labels: [enhancement]
body:
  - type: dropdown
    id: owner
    attributes:
      label: Owning area
      description: Which module should own this behavior.
      options:
        - Frontend (Next.js)
        - auth-service
        - user-service
        - catalog-service
        - cart-service
        - order-service
        - payment-service
        - support-service
        - api-gateway
        - eureka-server
        - Unsure — needs architecture review
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem this solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include API paths, request/response shape, and UI surfaces if known.
    validations:
      required: true
  - type: checkboxes
    id: slice
    attributes:
      label: Likely vertical slice
      options:
        - label: Backend endpoint + validation + persistence
        - label: API Gateway route
        - label: Frontend API client, validation, and UI
        - label: Kafka/event contract
        - label: Admin-only authorization
