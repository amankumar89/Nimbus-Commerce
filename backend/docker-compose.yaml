services:
  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nimbus-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_MS: 604800000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - nimbus-network

  # ============================================================
  # KAFKA UI
  # ============================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nimbus-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - nimbus-network

  # ============================================================
  # EUREKA SERVER
  # ============================================================

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: nimbus-eureka-server
    ports:
      - "8761:8761"
    networks:
      - nimbus-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: nimbus-auth-service
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - nimbus-network

  # ============================================================
  # USER SERVICE
  # ============================================================

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: nimbus-user-service
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - nimbus-network

  # ============================================================
  # CART SERVICE
  # ============================================================

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: nimbus-cart-service
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - nimbus-network

  # ============================================================
  # API GATEWAY
  # ============================================================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: nimbus-api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      cart-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - nimbus-network

# ==============================================================
# NETWORK
# ==============================================================

networks:
  nimbus-network:
    driver: bridge
