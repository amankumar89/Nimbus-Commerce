spring:
  application:
    name: eureka-server

server:
  port: 8761

eureka:
  client:
    # This IS the registry — it shouldn't register itself as a client or fetch a registry
    register-with-eureka: false
    fetch-registry: false
  server:
    # Slightly faster eviction for local dev — default is 90s, fine to leave default in production
    eviction-interval-timer-in-ms: 5000

logging:
  level:
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF