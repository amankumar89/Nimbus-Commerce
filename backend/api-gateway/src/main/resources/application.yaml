server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**,/addresses/**,/admin/customers/**

            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/products/**,/categories/**,/admin/products/**,/admin/categories/**

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/**,/wishlist/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**,/admin/orders/**,/admin/dashboard/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payments/**

            - id: support-service
              uri: lb://SUPPORT-SERVICE
              predicates:
                - Path=/support/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.aman.nimbus.apigateway: DEBUG

